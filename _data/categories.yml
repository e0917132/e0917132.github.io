# Post categories — Finder tags, Obsidian folders, Calendar colors. Listed in sidebar order.
# A post joins one with `categories: [slug]` in its front matter.
#   slug   used in front matter and in the address (?c=slug)
#   name   shown on screen · short  for tight spots · en  short English name (OG image, search)
#   ko     extra search words (not shown) · icon  symbol id from _includes/icons.html
#   color  the category's color in Calendar

